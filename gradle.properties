# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true

# Game
minecraft_version=26.3
# Game versions this build is released for: colon separated, oldest first; the first one is the manifest minimum.
#   single: minecraft_compat_versions=26.3     multiple: minecraft_compat_versions=26.3:26.3.1
minecraft_compat_versions=26.3

# Loader
enabled_platforms = fabric,neoforge
fabric_loader_version=0.19.5
neoforge_version = 26.3.0.34-beta

# Mod
maven_group=net.spell_engine
archives_name=spell_engine
mod_version=1.10.8

# Dependencies
fabric_api_version=0.161.0+26.3
# No 26.3-tagged release yet; 4.0.1 declares `minecraft >=26.1` on both loaders, so it loads on 26.3.
tiny_config_version=4.0.1
cloth_config_version=26.3.158
player_anim_version=1.2.7+mc.26.3
spell_power_version=1.6.2+26.3
ranged_weapon_api_version=4.0.0+26.3

critical_strike_version=1.0.6+26.3
# Critical Strike compat is compiled only when true
enable_critical_strike=true

# Compatibility
# EMI compat (net.spell_engine.compat.emi) is compiled only when true.
# EMI has no Minecraft 26.x release yet (latest: 1.1.24+1.21.1); flip this on once one is published.
enable_emi=false
emi_version=1.1.24+1.21.1
bundle_api_version=5.0.0+26.3
better_combat_version=3.2.2+26.3
combat_roll_version=3.0.1+26.3
shoulder_surfing_version=26.3-5.1.2
iris_version=1.11.6+26.3
ftb_teams_version=26.1.2.4
ftb_library_version=26.1.2.9
# ^ FTB has no 26.3 builds yet; compile-only, so the latest 26.1 API jars are used.

# Fabric only
# Trinkets Updated 4.0 (mod id `trinkets_updated`, API package eu.pb4.trinkets.api) no longer uses Cardinal Components;
# it nests yumi-mc-foundation (dev.yumi.mc.core:yumi-mc-foundation) instead.
trinkets_version=4.2.1+26.3
mod_menu_version=21.0.0
lamb_dynamic_lights_version=4.13.0+26.3

# NeoForge only
curios_version=17.0.0-beta.2+26.3
